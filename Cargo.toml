# <HANDWRITE gap="missing-generator:project-bootstrap" tracker="#pgpool-bootstrap" reason="Initial working-name app scaffold before pgpool has a generated TD source unit.">
[package]
name = "pgpool"
version = "0.4.13"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
description = "working-name PostgreSQL pooler service built on server-lifecycle/server-tcp/server-http"
build = "build.rs"
resolver = "2"

[lib]
name = "pgpool"
path = "src/lib.rs"

[[bin]]
name = "pgpool"
path = "src/bin/pgpool/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
bytes = "1.9"
clap = { version = "4", features = ["derive", "string", "env"] }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
mio = { version = "0.8", features = ["net", "os-poll"] }
schemars = "0.8"
server-http = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
server-lifecycle = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
server-tcp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tracing = "0.1"

[dev-dependencies]
futures-util = "0.3"
transport-h2c = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"] }
tower = "0.5"

[build-dependencies]
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }

[features]
default = []
self-update = ["cli-std/online"]
issue = ["cli-std/online"]

[lints.clippy]
mod_module_files = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
# </HANDWRITE>
